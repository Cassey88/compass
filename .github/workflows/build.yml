name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - id: ver
        run: echo "v=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> $GITHUB_OUTPUT
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Compass-v${{ steps.ver.outputs.v }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Compass-apk
          path: Compass-v${{ steps.ver.outputs.v }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Compass v${{ steps.ver.outputs.v }}
          make_latest: true
          files: Compass-v${{ steps.ver.outputs.v }}.apk
