plugins { id 'com.android.application' }

android {
    namespace 'nz.cassey.compass'
    compileSdk 34
    defaultConfig {
        applicationId 'nz.cassey.compass'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        debug {
            storeFile file('../compass.keystore')
            storePassword 'compass123'
            keyAlias 'compass'
            keyPassword 'compass123'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
